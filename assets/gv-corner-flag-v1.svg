<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" role="img" aria-label="Gündoğan Vize Danışmanlık bayrağı">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2=".15">
      <stop offset="0" stop-color="#98001b"/>
      <stop offset=".22" stop-color="#df1738"/>
      <stop offset=".52" stop-color="#bd0a2b"/>
      <stop offset=".78" stop-color="#ec2343"/>
      <stop offset="1" stop-color="#9e001d"/>
    </linearGradient>
    <filter id="wave" x="-12%" y="-22%" width="132%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .038" numOctaves="1" seed="11" result="noise">
        <animate attributeName="baseFrequency" dur="2.4s" values=".012 .038;.018 .052;.013 .041;.012 .038" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" dur="1.8s" values="5;10;7;11;5" repeatCount="indefinite"/>
      </feDisplacementMap>
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#001820" flood-opacity=".26"/>
    </filter>
  </defs>

  <g filter="url(#wave)">
    <path d="M18 44 C55 22 92 52 129 36 C169 19 205 53 245 37 C287 20 323 51 364 37 C407 22 449 39 518 58 L518 190 C464 174 420 203 377 187 C335 171 299 203 258 186 C216 169 179 201 139 185 C99 169 61 194 18 180 Z" fill="url(#red)"/>
    <path d="M26 61 C95 31 135 61 193 45 C255 28 296 61 353 45 C414 29 459 47 508 61" fill="none" stroke="#ff9aae" stroke-width="3" stroke-opacity=".55"/>
    <path d="M25 168 C82 188 125 163 181 180 C239 197 287 165 345 182 C401 198 455 178 508 187" fill="none" stroke="#710016" stroke-width="4" stroke-opacity=".35"/>

    <circle cx="92" cy="115" r="35" fill="#fff"/>
    <circle cx="106" cy="115" r="28" fill="#c8102e"/>
    <path d="M135 115 l12 -4 7 -12 2 14 12 9 -14 3 -7 12 -2 -14 -12 -8z" fill="#fff"/>
    <line x1="174" y1="71" x2="174" y2="160" stroke="#fff" stroke-width="2" stroke-opacity=".78"/>

    <text x="205" y="108" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#fff">GÜNDOĞAN VİZE</text>
    <text x="205" y="148" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="2">DANIŞMANLIK</text>
  </g>
</svg>