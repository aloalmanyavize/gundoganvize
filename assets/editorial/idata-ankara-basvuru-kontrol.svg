<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">iDATA Ankara başvuru kontrol listesi</title><desc id="d">Almanya veya İtalya vizesi için vize türü, yetki bölgesi, randevu ve evrak kontrolü.</desc><rect width="1200" height="630" rx="28" fill="#152943"/><rect x="45" y="45" width="1110" height="540" rx="22" fill="#f5f8fc"/><text x="90" y="127" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#152943">iDATA Ankara • Başvuru kontrolü</text><text x="90" y="170" font-family="Arial,sans-serif" font-size="23" fill="#51667c">Randevudan önce doğrulanması gereken adımlar</text><g font-family="Arial,sans-serif"><rect x="90" y="218" width="1020" height="69" rx="12" fill="#e4edf8"/><text x="117" y="261" font-size="27" fill="#173f72">01</text><text x="190" y="261" font-size="25" fill="#20364f">Vize türü ve başvuru ülkesini belirleyin</text><rect x="90" y="303" width="1020" height="69" rx="12" fill="#e4edf8"/><text x="117" y="346" font-size="27" fill="#173f72">02</text><text x="190" y="346" font-size="25" fill="#20364f">Güncel başvuru merkezi ve yetki bölgesini doğrulayın</text><rect x="90" y="388" width="1020" height="69" rx="12" fill="#e4edf8"/><text x="117" y="431" font-size="27" fill="#173f72">03</text><text x="190" y="431" font-size="25" fill="#20364f">Randevu, evrak ve biyometri koşullarını kontrol edin</text></g><text x="90" y="526" font-family="Arial,sans-serif" font-size="19" fill="#51667c">Gündoğan Vize • Bağımsız danışmanlık • iDATA ile resmî bağlantımız yoktur</text></svg>