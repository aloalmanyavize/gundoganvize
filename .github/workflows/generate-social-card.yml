name: Build Gundogan Vize social preview
on:
  push:
    branches: [main]
    paths:
      - '_tools/generate_social_card.py'
      - '.github/workflows/generate-social-card.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gundoganvize-social-image
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - run: python _tools/generate_social_card.py
      - name: Commit PNG if changed
        run: |
          git config user.name "gundoganvize-social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- assets/social-share.png
          if ! git diff --cached --quiet; then
            git commit -m "SEO: generate branded social preview [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
