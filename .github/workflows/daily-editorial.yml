name: Gündoğan Vize – Reviewed Daily Editorial

on:
  pull_request:
    paths:
      - 'editorial/**'
      - 'assets/editorial/**'
      - '_tools/editorial_publish.py'
      - '.github/workflows/daily-editorial.yml'
      - 'blog/index.html'
      - 'haberler/index.html'
      - 'index.html'
  push:
    branches: [main]
    paths:
      - 'editorial/queue.json'
      - 'editorial/queue-extra/**'
      - 'editorial/news.json'
      - '_tools/editorial_publish.py'
      - '.github/workflows/daily-editorial.yml'
  schedule:
    - cron: '25 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gundoganvize-editorial
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge reviewed supplemental queue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q = Path('editorial/queue.json')
          items = json.loads(q.read_text())
          seen = {x['slug'] for x in items}
          for p in sorted(Path('editorial/queue-extra').glob('*.json')) if Path('editorial/queue-extra').exists() else []:
              for x in json.loads(p.read_text()):
                  if x['slug'] not in seen:
                      items.append(x); seen.add(x['slug'])
          q.write_text(json.dumps(items, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Validate reviewed queue and page markers
        run: python _tools/editorial_publish.py --check
      - name: Bootstrap on isolated runner
        run: |
          python _tools/editorial_publish.py --bootstrap
          python _tools/editorial_publish.py --publish-one
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ET.parse('sitemap.xml')
          blog = sorted(Path('blog').glob('*/index.html'))
          news = sorted(Path('haberler').glob('*/index.html'))
          assert len(news) >= 2
          assert sum(x.name == 'index.html' and 'Gündoğan Vize yayını:' in x.read_text() for x in blog) >= 4
          for p in ('index.html','blog/index.html','haberler/index.html'):
              c = Path(p).read_text()
              assert '<!-- GVN_EDITORIAL_START -->' in c
              assert 'gvStory' in c
          print('Editorial smoke test passed;', len(blog), 'blog pages;', len(news), 'news pages')
          PY

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge reviewed supplemental queue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q = Path('editorial/queue.json')
          items = json.loads(q.read_text())
          seen = {x['slug'] for x in items}
          for p in sorted(Path('editorial/queue-extra').glob('*.json')) if Path('editorial/queue-extra').exists() else []:
              for x in json.loads(p.read_text()):
                  if x['slug'] not in seen:
                      items.append(x); seen.add(x['slug'])
          q.write_text(json.dumps(items, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Verify editorial queue
        run: python _tools/editorial_publish.py --check
      - name: Publish launch pack or one reviewed guide
        shell: bash
        run: |
          if [ ! -f blog/schengen-vizesi-basvuru-zamanlamasi/index.html ]; then
            python _tools/editorial_publish.py --bootstrap
          else
            python _tools/editorial_publish.py --publish-one
          fi
      - name: Validate XML output
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml')"
      - name: Commit generated pages with safe retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gundoganvize-editorial-bot"
          git config user.email "actions@users.noreply.github.com"

          stage_generated() {
            git add -- index.html blog/index.html haberler/index.html sitemap.xml
            while IFS= read -r -d '' page; do
              git add -- "$page"
            done < <(find blog haberler -mindepth 2 -maxdepth 2 -type f -name index.html -print0)
          }

          stage_generated
          if git diff --cached --quiet; then
            echo "Nothing new to publish"
            exit 0
          fi
          git commit -m "Editorial: publish reviewed Schengen content [skip ci]"

          for attempt in 1 2 3 4 5; do
            echo "Publishing attempt $attempt / 5"
            if push_output=$(git push origin HEAD:main 2>&1); then
              echo "$push_output"
              echo "Editorial content published successfully"
              exit 0
            fi
            echo "$push_output"
            if grep -Eiq 'GH006|GH013|protected branch|permission denied|write access.*not granted|HTTP 403' <<< "$push_output"; then
              echo "::error::GitHub write permission or branch protection blocks publishing"
              exit 1
            fi
            if [ "$attempt" -eq 5 ]; then
              break
            fi

            echo "Main changed while publishing: rebuilding on the latest version"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -- blog haberler

            python - <<'PY'
          import json
          from pathlib import Path
          q = Path('editorial/queue.json')
          items = json.loads(q.read_text())
          seen = {x['slug'] for x in items}
          extra = Path('editorial/queue-extra')
          for p in sorted(extra.glob('*.json')) if extra.exists() else []:
              for x in json.loads(p.read_text()):
                  if x['slug'] not in seen:
                      items.append(x)
                      seen.add(x['slug'])
          q.write_text(json.dumps(items, ensure_ascii=False, indent=2) + '\n')
          PY

            python _tools/editorial_publish.py --check
            if [ ! -f blog/schengen-vizesi-basvuru-zamanlamasi/index.html ]; then
              python _tools/editorial_publish.py --bootstrap
            else
              python _tools/editorial_publish.py --publish-one
            fi
            python -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml')"
            stage_generated
            if git diff --cached --quiet; then
              echo "Content already published in latest main"
              exit 0
            fi
            git commit -m "Editorial: publish reviewed Schengen content [skip ci]"
            sleep "$attempt"
          done

          echo "::error::Publishing failed after 5 retries; remote main kept unchanged"
          exit 1
