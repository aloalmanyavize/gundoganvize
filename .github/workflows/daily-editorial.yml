name: Gündoğan Vize – Reviewed Daily Editorial

on:
  pull_request:
    paths:
      - 'editorial/**'
      - 'assets/editorial/**'
      - '_tools/editorial_publish.py'
      - '.github/workflows/daily-editorial.yml'
      - '_tools/check_sitemap.py'
      - '_tools/site_audit.py'
      - 'site-repair.css'
      - 'styles.css'
      - 'blog/index.html'
      - 'blog/*/index.html'
      - 'fransa-vizesi/index.html'
      - 'haberler/index.html'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gundoganvize-editorial
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge reviewed supplemental queue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q = Path('editorial/queue.json')
          items = json.loads(q.read_text())
          seen = {x['slug'] for x in items}
          for p in sorted(Path('editorial/queue-extra').glob('*.json')) if Path('editorial/queue-extra').exists() else []:
              for x in json.loads(p.read_text()):
                  if x['slug'] not in seen:
                      items.append(x); seen.add(x['slug'])
          q.write_text(json.dumps(items, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Validate reviewed queue and page markers
        run: python _tools/editorial_publish.py --check
      - name: Bootstrap on isolated runner
        run: |
          python _tools/editorial_publish.py --bootstrap
          python _tools/editorial_publish.py --publish-one
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ET.parse('sitemap.xml')
          blog = sorted(Path('blog').glob('*/index.html'))
          news = sorted(Path('haberler').glob('*/index.html'))
          assert len(news) >= 2
          assert sum(x.name == 'index.html' and 'Gündoğan Vize yayını:' in x.read_text() for x in blog) >= 4
          for p in ('index.html','blog/index.html','haberler/index.html'):
              c = Path(p).read_text()
              assert '<!-- GVN_EDITORIAL_START -->' in c
              assert 'gvStory' in c
          print('Editorial smoke test passed;', len(blog), 'blog pages;', len(news), 'news pages')
          PY
      - name: Audit complete site link and HTML structure
        run: python _tools/site_audit.py
      - name: Verify priority URLs remain in sitemap
        run: python _tools/check_sitemap.py
      - name: Verify France landing and conversion links
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          blog = Path('blog/vfs-global-fransa-vize-randevu-rehberi/index.html').read_text(encoding='utf-8')
          country = Path('fransa-vizesi/index.html').read_text(encoding='utf-8')
          assert '<link rel="canonical" href="https://gundoganvize.com/blog/vfs-global-fransa-vize-randevu-rehberi/">' in blog
          assert '/randevu-talebi/' in blog and 'www.france-visas.gouv.fr/en/web/france-visas/turquie' in blog
          assert 'Ankara, Gaziantep, İstanbul ve İzmir' in blog
          assert '/blog/vfs-global-fransa-vize-randevu-rehberi/' in country
          class TagChecker(HTMLParser):
              pass
          TagChecker().feed(blog)
          TagChecker().feed(country)
          print('France SEO and conversion navigation smoke test passed')
          PY

